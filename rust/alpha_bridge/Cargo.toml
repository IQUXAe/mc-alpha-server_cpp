[package]
name = "alpha_bridge"
version = "0.1.0"
edition = "2021"

[lib]
# staticlib feeds the C++ server until the cutout; rlib feeds the
# native binary (and disappears with the staticlib at the cutout).
crate-type = ["staticlib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
libc = "0.2"
flate2 = "1"
zstd = "0.13"
ureq = "2"
rusty-leveldb = "4"
